workflows:
  workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Build APK
        script: |
          sudo apt-get update -y
          sudo apt-get install -y gradle
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk