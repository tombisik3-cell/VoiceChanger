workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Build APK
        script: |
          curl -L -o gradle/wrapper/gradle-wrapper.jar "https://github.com/google/iosched/raw/main/gradle/wrapper/gradle-wrapper.jar"
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk